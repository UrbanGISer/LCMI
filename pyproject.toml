[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lcmi"
version = "0.1.0"
description = "Local Conditional Mutual Information (LCMI): interpretable, nonlinear spatially varying effect modelling"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Lingbo Liu" }]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22",
    "pandas>=1.4",
    "scipy>=1.8",
    "scikit-learn>=1.0",
    "matplotlib>=3.5",
    "joblib>=1.1",
]
keywords = ["spatial", "GIS", "mutual information", "varying coefficient", "GWR", "explainable AI"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: GIS",
]

[project.optional-dependencies]
examples = ["mgwr", "geoshapley", "XGeoML", "jupyter"]

[project.urls]
Homepage = "https://github.com/UrbanGISer/LCMI"

[tool.setuptools]
packages = ["lcmi"]
